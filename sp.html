<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CICC Prayer Times Announcement</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
    background: #4CAF50; color: #111; display: flex; align-items: center;
    justify-content: center; padding: 18px;
  
  main {
    width: min(1500px, 100%); display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 22px; align-items: center;
  }
  .panel { min-width: 0; }
  .table-panel { display: flex; align-items: center; }
  table {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    background: white; box-shadow: 0 3px 14px #0002;
  }
  th, td {
    border: 2px solid #222; padding: 16px 8px; text-align: center;
    font-size: clamp(1.1rem, 3.1vw, 3.3rem); font-weight: bold;
    overflow-wrap: anywhere;
  }
  th { background: #d7b899; }
  .fajr-row { background: #c8e6c9; }
  .dhuhr-row, .asr-row { background: #ffe0b2; }
  .maghrib-row { background: #f8bbd0; }
  .isha-row { background: #bbdefb; }
  .header { text-align: center; }
  .brand { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
  #logo { max-height: 100px; max-width: 180px; object-fit: contain; }
  #bismillah-text { font-size: clamp(1.4rem, 3vw, 3rem); font-weight: bold; font-family: "Traditional Arabic", serif; }
  .announcement {
    margin: 22px 0 12px; padding: 16px; border: 4px solid #fff;
    background: #fff9c4; border-radius: 10px; text-align: center;
    font-weight: bold; font-size: clamp(1.6rem, 3.5vw, 3.5rem);
  }
  #selected-date { display: block; margin-top: 8px; color: #b00020; }
  .sunrise { font-size: clamp(1.1rem, 2.2vw, 2rem); font-weight: bold; margin: 12px 0; }
  .notice { font-size: clamp(1rem, 1.5vw, 1.35rem); text-align: center; line-height: 1.45; }
  .jummah { font-size: clamp(1.2rem, 2vw, 1.8rem); font-weight: bold; text-align: center; margin: 22px 0 8px; }
  .charity { text-align: center; font-size: 0.95rem; }
  .edit-note { max-width: 900px; margin: 18px auto 0; font-size: 0.9rem; color: #173317; text-align: center; }
  @media (max-width: 760px) {
    body { padding: 10px; align-items: flex-start; }
    main { grid-template-columns: 1fr; gap: 16px; }
    .table-panel { order: 2; }
    .info-panel { order: 1; }
    th, td { padding: 12px 5px; font-size: clamp(1.05rem, 5vw, 1.8rem); }
    #logo { max-height: 60px; max-width: 100px; }
    .announcement { margin-top: 12px; }
  }
  @media print {
    body { background: white; padding: 0; }
    main { width: 100%; gap: 12px; }
    .announcement { border-color: #222; }
    .edit-note { display: none; }
  }
</style>
</head>
<body>
<main>
  <section class="panel table-panel" aria-label="Prayer timetable">
    <table>
      <thead>
        <tr><th>صلاة<br>Prayer</th><th>أَذَان<br>Athan</th><th>إِقَامَة<br>Iqama</th></tr>
      </thead>
      <tbody id="prayer-times-body"></tbody>
    </table>
  </section>

  <section class="panel info-panel">
    <div class="header">
      <div class="brand">
        <img id="logo" src="ciccbg.png" alt="CICC logo">
        <span id="bismillah-text">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</span>
      </div>
      <div class="announcement">
        CICC Prayer Times
        <span id="selected-date"></span>
      </div>
      <div class="sunrise" id="sunrise-time"></div>
      <p class="notice">Please note the prayer timings shown are for the date above.</p>
    </div>
    <div class="jummah">Jummah Khutbah starts at 13:15</div>
    <p class="charity">CICC is a charity organization, Charity No. RCN 20200211.</p>
  </section>
</main>


<script>
async function loadPrayerTimes() {
    try {
        const response = await fetch('./sp.json');

        if (!response.ok) {
            throw new Error('Could not load sp.json: ' + response.status);
        }

        const data = await response.json();

        // Display the selected date
        const dateParts = data.Date.split('/');
        const date = new Date(
            Number(dateParts[2]),
            Number(dateParts[1]) - 1,
            Number(dateParts[0])
        );

        const weekday = data.Weekday ||
            date.toLocaleDateString('en-GB', { weekday: 'long' });

        document.getElementById('selected-date').textContent =
            weekday + ', ' + date.toLocaleDateString('en-GB', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

        // Display sunrise
        document.getElementById('sunrise-time').textContent =
            '🌅 Sunrise: ' + (data.Sunrise || '—');

        // Display prayer timings
        const tbody = document.getElementById('prayer-times-body');
        tbody.innerHTML = '';

        const rowClasses = {
            Fajr: 'fajr-row',
            Dhuhr: 'dhuhr-row',
            Asr: 'asr-row',
            Maghrib: 'maghrib-row',
            Isha: 'isha-row'
        };

        data.Prayers.forEach(prayer => {
            const row = document.createElement('tr');
            row.className = rowClasses[prayer.Name] || '';

            [prayer.Name, prayer.Athan || '—', prayer.Iqama || '—']
                .forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                });

            tbody.appendChild(row);
        });

    } catch (error) {
        console.error('Error loading prayer times:', error);
        document.getElementById('sunrise-time').textContent =
            'Unable to load prayer times. Check sp.json.';
    }
}

loadPrayerTimes();
</script>

</body>
</html>
